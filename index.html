<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAD - Launchpad Central</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #09090b;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-hover: rgba(56, 189, 248, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-cyan: #38bdf8;
            --accent-green: #10b981;
            --nav-height: 70px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            overflow: hidden; /* Prevents all scrolling */
            width: 100vw;
            height: 100vh;
            background-image: linear-gradient(rgba(9, 9, 11, 0.2), rgba(9, 9, 11, 0.35)), url('foto_robot.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* --- TOP NAVIGATION BAR --- */
        #top-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--nav-height);
            background: rgba(9, 9, 11, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 0 20px;
            z-index: 2000;
            transform: translateY(-100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #top-nav.visible {
            transform: translateY(0);
        }

        .nav-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn:hover {
            color: var(--text-primary);
            background: var(--glass-bg);
            border-color: var(--glass-border);
        }

        .nav-btn.active {
            color: var(--accent-cyan);
            background: var(--glass-hover);
            border-color: rgba(56, 189, 248, 0.3);
        }

        .nav-btn.home-btn {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--glass-border);
            color: var(--text-primary);
            margin-right: 15px;
        }

        .nav-btn.home-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* --- HOME VIEW (LAUNCHPAD) --- */
        #home-view {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between; /* Separar header arriba y botones abajo */
            padding: 6rem 2rem 4rem 2rem;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.4s ease, visibility 0.4s;
            z-index: 1000;
        }

        #home-view.hidden {
            opacity: 0;
            visibility: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -1.5px;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--text-secondary);
            font-weight: 300;
        }

        .global-total {
            margin-top: 1rem;
            display: inline-block;
            color: var(--accent-green);
            font-size: 2rem;
            font-weight: 800;
            text-shadow: 0 4px 15px rgba(0,0,0,0.9);
            animation: fadeInDown 0.8s ease-out 0.1s backwards;
        }

        .grid-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            max-width: 1000px;
            animation: fadeInUp 0.8s ease-out 0.2s backwards;
        }

        .big-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0.75rem 1.5rem; /* Botones más bajos/planos */
            border-radius: 12px;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.95rem;
            font-weight: 600;
            background: rgba(9, 9, 11, 0.65); /* Fondo oscuro más sutil */
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(8px);
            cursor: pointer;
        }

        .big-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.2);
        }

        /* Specific Brand Colors on Hover */
        .big-btn.sim-final:hover { border-color: #38bdf8; background: rgba(56, 189, 248, 0.1); color: #38bdf8; }
        .big-btn.sim-est:hover { border-color: #a855f7; background: rgba(168, 85, 247, 0.1); color: #c084fc; }
        .big-btn.p-elec:hover { border-color: #f59e0b; background: rgba(245, 158, 11, 0.1); color: #fbbf24; }
        .big-btn.p-mec:hover { border-color: #10b981; background: rgba(16, 185, 129, 0.1); color: #34d399; }
        .big-btn.p-sof:hover { border-color: #ef4444; background: rgba(239, 68, 68, 0.1); color: #f87171; }

        /* --- APP VIEW (IFRAME CONTAINER) --- */
        #app-view {
            position: absolute;
            top: var(--nav-height);
            left: 0;
            width: 100vw;
            height: calc(100vh - var(--nav-height));
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s;
            z-index: 500;
            background: var(--bg-dark);
        }

        #app-view.visible {
            opacity: 1;
            visibility: visible;
        }

        #main-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes scaleIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

    <!-- TOP NAV BAR -->
    <nav id="top-nav">
        <button class="nav-btn home-btn" onclick="goHome()">🏠 Inicio</button>
        <button class="nav-btn" data-target="visor_final.html" onclick="loadApp('visor_final.html', this)">🚀 Prototipo Final</button>
        <button class="nav-btn" data-target="visor_estructural.html" onclick="loadApp('visor_estructural.html', this)">⚙️ Estructura</button>
        <button class="nav-btn" data-target="presupuesto.html" onclick="loadApp('presupuesto.html', this)">⚡ P. Electrónica</button>
        <button class="nav-btn" data-target="presupuesto_mecanica.html" onclick="loadApp('presupuesto_mecanica.html', this)">🔧 P. Mecánica</button>
        <button class="nav-btn" data-target="presupuesto_informatica.html" onclick="loadApp('presupuesto_informatica.html', this)">💻 P. Software</button>
    </nav>

    <!-- HOME LAUNCHPAD -->
    <div id="home-view">
        <header>
            <h1>Proyecto VAD</h1>
            <div class="global-total" id="global-total-badge">Calculando...</div>
        </header>

        <div class="grid-buttons">
            <button class="big-btn sim-final" onclick="loadApp('visor_final.html')">🚀 Prototipo Final Integrado</button>
            <button class="big-btn sim-est" onclick="loadApp('visor_estructural.html')">⚙️ Estructura de Caño</button>
            <button class="big-btn p-elec" onclick="loadApp('presupuesto.html')">⚡ Presupuesto Electrónica</button>
            <button class="big-btn p-mec" onclick="loadApp('presupuesto_mecanica.html')">🔧 Presupuesto Mecánica</button>
            <button class="big-btn p-sof" onclick="loadApp('presupuesto_informatica.html')">💻 Presupuesto Software e IA</button>
        </div>
    </div>

    <!-- MAIN APP RENDERER -->
    <div id="app-view">
        <iframe id="main-frame" src=""></iframe>
    </div>

    <script src="presupuesto_data.js"></script>
    <script>
        const homeView = document.getElementById('home-view');
        const appView = document.getElementById('app-view');
        const topNav = document.getElementById('top-nav');
        const iframe = document.getElementById('main-frame');
        const navBtns = document.querySelectorAll('#top-nav .nav-btn:not(.home-btn)');

        // Calcular Total Global
        async function updateGlobalTotal() {
            let totalGeneral = 0;
            // Forzar lectura de la base de datos (Backend)
            try {
                const res = await fetch('/api/budget');
                if (res.ok) {
                    appData = await res.json();
                } else if (typeof DEFAULT_PRESUPUESTOS !== 'undefined') {
                    appData = DEFAULT_PRESUPUESTOS;
                }
            } catch(e) {
                if (typeof DEFAULT_PRESUPUESTOS !== 'undefined') {
                    appData = DEFAULT_PRESUPUESTOS;
                }
            }
            
            if (appData) {
                for (let category in appData) {
                    if (appData[category] && appData[category].categorias) {
                        appData[category].categorias.forEach(cat => {
                            cat.items.forEach(item => {
                                let qty = 1;
                                if (item.cant) {
                                    const match = item.cant.toString().match(/\d+/);
                                    if (match) qty = parseInt(match[0], 10);
                                }
                                totalGeneral += (item.precio * qty);
                            });
                        });
                    }
                }
            }
            document.getElementById('global-total-badge').innerText = `Presupuesto Total: $${totalGeneral.toFixed(2)}`;
        }
        
        updateGlobalTotal(); // Ejecutar al cargar

        // Escuchar cuando el iframe recarga para actualizar el total (si el usuario editó)
        iframe.addEventListener('load', () => {
            try {
                // Forzar lectura de localStorage de nuevo por si hubo cambios en la otra vista
                const raw = localStorage.getItem('appData_presupuesto');
                if (raw) appData = JSON.parse(raw);
                updateGlobalTotal();
            } catch(e) {}
        });

        function loadApp(url, clickedBtn = null) {
            // Hide home, show app
            homeView.classList.add('hidden');
            appView.classList.add('visible');
            topNav.classList.add('visible');

            // Load iframe content if it's different
            if (iframe.src.indexOf(url) === -1) {
                iframe.src = url;
            }

            // Update active state on nav buttons
            navBtns.forEach(btn => btn.classList.remove('active'));
            
            // Find the correct button to highlight
            let targetBtn = clickedBtn;
            if (!targetBtn) {
                targetBtn = Array.from(navBtns).find(btn => btn.getAttribute('data-target') === url);
            }
            if (targetBtn) {
                targetBtn.classList.add('active');
            }
        }

        function goHome() {
            homeView.classList.remove('hidden');
            appView.classList.remove('visible');
            topNav.classList.remove('visible');
            
            // Optional: clear iframe to save resources when on home screen
            // iframe.src = "";
            navBtns.forEach(btn => btn.classList.remove('active'));
        }
    </script>
</body>
</html>
