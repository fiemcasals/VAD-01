<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presupuesto Mecánica | Minimal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #09090b;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.05);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-blue: #f59e0b; /* Amber para Mecánica */
            --accent-green: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(245, 158, 11, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.05) 0%, transparent 50%);
        }

        .nav-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .nav-tabs a {
            text-decoration: none;
            color: var(--text-secondary);
            padding: 0.5rem 1.5rem;
            border-radius: 100px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .nav-tabs a:hover {
            color: var(--text-primary);
            border-color: rgba(255,255,255,0.2);
        }

        .nav-tabs a.active {
            background: rgba(245, 158, 11, 0.1);
            color: var(--accent-blue);
            border-color: rgba(245, 158, 11, 0.2);
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        header {
            text-align: center;
            margin-bottom: 4rem;
        }

        h1 {
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: -1px;
            margin-bottom: 0.5rem;
        }

        h1 span {
            font-weight: 600;
            background: linear-gradient(135deg, var(--text-primary), var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .total-badge {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.75rem 2rem;
            border-radius: 100px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: var(--accent-green);
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.1);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .category-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 2rem;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .category-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255,255,255,0.1);
        }

        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--glass-border);
        }

        .category-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .category-subtotal {
            font-size: 1.1rem;
            color: var(--accent-blue);
            font-weight: 600;
        }

        .item-list {
            list-style: none;
        }

        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            font-size: 0.95rem;
        }

        .item:last-child {
            margin-bottom: 0;
        }

        .item-name {
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .item-qty {
            font-size: 0.75rem;
            background: rgba(255,255,255,0.1);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--text-primary);
        }

        .item-price {
            color: var(--text-primary);
        }

        .item-name a {
            color: inherit;
            text-decoration: none;
            transition: color 0.2s, opacity 0.2s;
        }
        
        .item-name a:hover {
            color: var(--accent-blue);
            opacity: 0.8;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="nav-tabs">
        <a href="index.html">Electrónica</a>
        <a href="presupuesto_mecanica.html" class="active">Mecánica</a>
        <a href="presupuesto_informatica.html">Informática</a>
    </div>

    <div class="container">
        <header>
            <h1>Presupuesto <span id="titulo-span"></span></h1>
            <div class="total-badge" id="total-badge">$0.00</div>
        </header>

        <div class="grid" id="grid-container">
            <!-- Inyectado vía JS -->
        </div>
    </div>

    <!-- Script Maestro de Datos -->
    <script src="presupuesto_data.js"></script>
    <script>
        // Renderizar dinámicamente la categoría "mecanica"
        renderizarPresupuesto('mecanica');
    </script>
</body>
</html>
